<title>Up &amp; Down the River</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#f2f3f8; --surface:#ffffff; --surface-2:#e5e8f2; --ink:#161a2c; --muted:#5c6280; --line:#d6dae8;
  --accent:#c2255c; --accent-ink:#ffffff; --river:#1c6fc4; --red:#c0263a;
  --lead:#fbe7ef; --good:#1f7a4d; --good-bg:#e3f4ea; --miss:#b3261e; --miss-bg:#fdeceb; --warn:#a4470f; --warn-bg:#fdf0e4;
  --shadow:0 1px 2px rgba(22,26,44,.06),0 6px 18px rgba(22,26,44,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1020; --surface:#171a2e; --surface-2:#21253d; --ink:#eef0fa; --muted:#a0a6c4; --line:#2f3452;
  --accent:#f06595; --accent-ink:#0e1020; --river:#6cb4ff; --red:#ff7a8a;
  --lead:#3a1a2a; --good:#5fd39a; --good-bg:#15301f; --miss:#f28b82; --miss-bg:#3b1e1c; --warn:#f5a35c; --warn-bg:#3a2614;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1020; --surface:#171a2e; --surface-2:#21253d; --ink:#eef0fa; --muted:#a0a6c4; --line:#2f3452;
  --accent:#f06595; --accent-ink:#0e1020; --river:#6cb4ff; --red:#ff7a8a;
  --lead:#3a1a2a; --good:#5fd39a; --good-bg:#15301f; --miss:#f28b82; --miss-bg:#3b1e1c; --warn:#f5a35c; --warn-bg:#3a2614;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:800;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:36px;height:36px;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--miss);border-color:var(--miss)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border-radius:999px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.names{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.lbl{font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle .ts{display:block;font-size:13px;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:999px;padding:0;position:relative;background:var(--surface-2);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}

/* river map */
.map{display:flex;align-items:flex-end;gap:3px;height:64px;padding:4px 0}
.map span{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:var(--surface-2)}
.map span.done{background:var(--river);opacity:.55}
.map span.now{background:var(--accent)}
.maplbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* standings */
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:2px 12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pl.lead{background:var(--lead);border-color:var(--accent)}
.rank{font-weight:800;color:var(--muted);text-align:center;font-size:18px;grid-row:1 / 3}
.pl.lead .rank{color:var(--accent)}
.pn{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;text-align:right;line-height:1;grid-row:1 / 3;grid-column:3}
.gap{font-size:13px;font-weight:700;color:var(--muted)}
.pl.lead .gap{color:var(--accent)}

/* round strip */
.strip{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg)}
.strip .cards{grid-row:1 / 4;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:46px;line-height:1;text-align:center;min-width:56px}
.strip .cards small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.strip .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px}
.strip .meta{font-size:14px;opacity:.85}

/* entry */
.prow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.phead{display:flex;align-items:baseline;gap:8px}
.phead .pn{font-size:16px}
.phead .tag{font-size:12px;font-weight:700;color:var(--muted)}
.phead .pick{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;white-space:nowrap}
.phead .auto{font-size:12px;font-weight:700;color:var(--river);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:0;height:42px;font-size:17px;font-variant-numeric:tabular-nums;border-radius:8px;position:relative}
.grid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}

/* guide */

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "river-scorekeeper-v1";
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#c2255c"/><stop offset=".5" stop-color="#1c6fc4"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg)"/><path d="M14 64 Q 26 56 38 64 T 62 64 T 86 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M36 42 L36 18 M28 26 L36 18 L44 26 M64 18 L64 42 M56 34 L64 42 L72 34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SCORING = {
  classic: { label:"10 + bid", made:b=>10+b, miss:()=>0, desc:"Hit your bid exactly: 10 points plus your bid. Miss: 0." },
  tricks:  { label:"Tricks + 10 bonus", made:b=>10+b, miss:(b,t)=>t, desc:"1 point for every trick you take, plus a 10-point bonus if you hit your bid exactly." },
  penalty: { label:"Miss costs you", made:b=>10+b, miss:(b,t)=>-5*Math.abs(b-t), desc:"Hit your bid: 10 plus your bid. Miss: minus 5 for every trick you were off." },
};

const blank = () => ({ count:4, names:["","","","","","",""], firstDealer:0, start:7, shape:"downup", scoring:"classic", hook:false, zero:true, bidStyle:"simul" });
let state = load() || { phase:"setup", setup:blank(), players:[], plan:[], rules:{}, dealer0:0, rounds:[], pending:null, tab:"game" };
// Older saves: default to everyone bidding at once
if (state.setup && state.setup.bidStyle == null){ state.setup.bidStyle = "simul"; state.setup.hook = false; }
if (state.rules && state.rules.bidStyle == null) state.rules.bidStyle = state.rules.hook ? "around" : "simul";
const simul = () => state.rules.bidStyle !== "around";
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const N = i => esc(state.players[i]);
const maxCards = n => Math.floor(51 / n); // leave one card to flip for trump

function buildPlan(start, shape, zero){
  const down = []; for (let c = start; c >= 1; c--) down.push(c);
  const up = []; for (let c = 1; c <= start; c++) up.push(c);
  const z = zero ? [0] : [];
  if (shape === "downup") return zero ? down.concat(z, up) : down.concat(up.slice(1));
  if (shape === "downup2") return down.concat(z, up);
  if (shape === "updown") return z.concat(up, down.slice(1), z);
  return down.concat(z); // down only
}
// A 0 round deals 1 card that goes on your forehead
const dealt = i => Math.max(1, state.plan[i]);
const isZero = i => state.plan[i] === 0;
const SUITS = [{k:"S",s:"♠"},{k:"H",s:"♥",r:1},{k:"D",s:"♦",r:1},{k:"C",s:"♣"},{k:"N",s:"No trump"}];
const suitHtml = k => { const x = SUITS.find(q=>q.k===k); return !x ? "" : x.k==="N" ? "NT" : x.r ? `<span class="red">${x.s}</span>` : x.s; };
const scoreOf = (bid, took) => { const S = SCORING[state.rules.scoring] || SCORING.classic; return bid === took ? S.made(bid) : S.miss(bid, took); };
function totals(k){ const t = state.players.map(()=>0); state.rounds.slice(0, k ?? state.rounds.length).forEach(r => r.bids.forEach((b,i)=> t[i] += scoreOf(b, r.tricks[i]))); return t; }
const dealerOf = r => (state.dealer0 + r) % state.players.length;
const done = () => state.rounds.length >= state.plan.length;
const dirOf = r => { const p = state.plan; if (r === 0) return p.length > 1 && p[1] > p[0] ? "up" : "down"; return p[r] < p[r-1] ? "down" : p[r] > p[r-1] ? "up" : "turn"; };

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const reset = state.phase === "play" && state.tab === "game" ? `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>` : "";
  app.innerHTML = `<div class="brand"><div class="logo">${LOGO}<h1>Up &amp; Down the River</h1></div><div class="hx-hbtns">${hx.button()}${reset}</div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-game" data-act="tab" data-v="game" aria-selected="${state.tab==="game"}">Game</button><button class="tab" role="tab" id="tab-guide" data-act="tab" data-v="guide" aria-selected="${state.tab==="guide"}">How to play</button></div>` +
    (state.tab === "guide" ? guideView() : state.phase === "setup" ? setupView() : playView());
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  window.scrollTo(0, y);
}

function riverMap(plan, doneCount){
  const max = Math.max(...plan);
  return `<div class="map" aria-hidden="true">${plan.map((c,i)=>`<span class="${i<doneCount?"done":i===doneCount?"now":""}" style="height:${c===0?6:Math.max(12, c/max*100)}%"></span>`).join("")}</div>`;
}

function setupView(){
  const su = state.setup, mx = maxCards(su.count);
  if (su.start > mx) su.start = mx;
  if (su.firstDealer >= su.count) su.firstDealer = 0;
  if (su.zero == null) su.zero = true;
  const plan = buildPlan(su.start, su.shape, su.zero);
  const opts = Array.from({length:su.count},(_,i)=>`<option value="${i}" ${i===su.firstDealer?"selected":""}>${esc((su.names[i]||"").trim()||`Player ${i+1}`)}</option>`).join("");
  const shapes = [["downup","Down, then back up"],["downup2","Down and up, two rounds of 1"],["updown","Up, then back down"],["down","Just down"]];
  return `
  <div class="panel">
    <div class="eyebrow">Players, in seating order going left</div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer players" ${su.count<=2?"disabled":""}>−</button>
      <span class="count num">${su.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More players" ${su.count>=7?"disabled":""}>+</button>
      <p class="hint grow">2 to 7 players. 4 to 6 plays best.</p>
    </div>
    <div class="names">${Array.from({length:su.count},(_,i)=>`<input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(su.names[i]||"")}" maxlength="14" autocomplete="off" aria-label="Player ${i+1}">`).join("")}</div>
    <div class="setrow"><label class="lbl" for="first-dealer">First dealer</label><select id="first-dealer">${opts}</select></div>
  </div>
  <div class="panel">
    <div class="eyebrow">The river</div>
    <div class="setrow" style="border:0;padding:0">
      <span class="lbl">Starting hand size</span>
      <div class="stepper">
        <button id="cminus" data-act="start" data-d="-1" aria-label="Fewer cards" ${su.start<=1?"disabled":""}>−</button>
        <span class="count num">${su.start}</span>
        <button id="cplus" data-act="start" data-d="1" aria-label="More cards" ${su.start>=mx?"disabled":""}>+</button>
        <p class="hint grow">cards each. With ${su.count} players the most you can deal is ${mx}.</p>
      </div>
    </div>
    <div class="setrow"><span class="lbl">Direction</span>
      <div class="opts">${shapes.map(([k,l])=>`<button class="opt" id="shape-${k}" data-act="shape" data-v="${k}" aria-pressed="${su.shape===k}">${l}</button>`).join("")}</div>
      ${riverMap(plan, -1)}
      <div class="maplbl num"><span>Round 1: ${plan[0]===0?"forehead":plan[0]+" card"+(plan[0]>1?"s":"")}</span><span>${plural(plan.length,"round")}</span><span>Last: ${plan[plan.length-1]===0?"forehead":plan[plan.length-1]}</span></div>
      <p class="hint num">Rounds: ${plan.map(c=>c===0?"0🙈":c).join(" · ")}</p>
    </div>
    <div class="setrow"><div class="toggle"><span class="lbl">Zero round<span class="ts">At the bottom of the river, everyone gets 1 card on their forehead. You can see everyone's card but your own.</span></span>
      <button class="switch" role="switch" id="sw-zero" data-act="zero" aria-checked="${su.zero}" aria-label="Zero round"></button></div></div>
    <div class="setrow"><span class="lbl">Scoring</span>
      <div class="opts">${Object.entries(SCORING).map(([k,v])=>`<button class="opt" id="sc-${k}" data-act="scoring" data-v="${k}" aria-pressed="${su.scoring===k}">${v.label}</button>`).join("")}</div>
      <p class="hint">${SCORING[su.scoring].desc}</p>
    </div>
    <div class="setrow"><span class="lbl">Bidding</span>
      <div class="opts"><button class="opt" id="bs-simul" data-act="bidStyle" data-v="simul" aria-pressed="${su.bidStyle!=="around"}">Everyone at once</button>
      <button class="opt" id="bs-around" data-act="bidStyle" data-v="around" aria-pressed="${su.bidStyle==="around"}">Around the table</button></div>
      ${su.bidStyle==="around" ? `<div class="toggle"><span class="lbl">Hook the dealer<span class="ts">The dealer bids last and can't pick a number that makes the bids add up to the cards dealt, so someone always misses.</span></span>
      <button class="switch" role="switch" id="sw-hook" data-act="hook" aria-checked="${su.hook}" aria-label="Hook the dealer"></button></div>` : `<p class="hint">Everyone reveals their bid at the same moment, then you record them. Nobody bids last, so there's no dealer hook.</p>`}
    </div>
  </div>
  <button class="primary" data-act="begin" id="begin">Start game</button>`;
}

function playView(){
  const n = state.rounds.length, t = totals(), fin = done(), has = n > 0;
  const hi = Math.max(...t);
  const order = t.map((v,i)=>i).sort((a,b)=> t[b]-t[a] || a-b);
  const rank = i => 1 + t.filter(v => v > t[i]).length;

  let top = "";
  if (fin){
    const w = order.filter(i => t[i] === hi);
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${plural(n,"round")}</div>
      <h2>${w.length>1?`Tie: ${w.map(N).join(" &amp; ")}`:`${N(w[0])} wins`} with ${hi}</h2>
      <div class="num">${order.filter(i=>t[i]!==hi).map(i=>`${N(i)} ${t[i]}`).join(" · ")}</div>
      ${hx.saved()}
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch</button><button data-act="newsetup" id="newsetup">New setup</button></div></div>`;
  }

  const players = order.map(i => {
    const lead = has && t[i] === hi;
    let gap = "";
    if (has){
      if (lead){ const others = t.filter(v=>v!==hi); gap = t.filter(v=>v===hi).length>1 ? "Tied for the lead" : others.length ? `Leads by ${hi - Math.max(...others)}` : ""; }
      else {
        const ahead = t.filter(v => v > t[i]), nearest = Math.min(...ahead);
        gap = `${hi - t[i]} behind the lead`;
        if (nearest !== hi){ const who = order.find(j => t[j] === nearest); gap += ` · ${nearest - t[i]} behind ${N(who)}`; }
      }
    }
    return `<div class="pl ${lead?"lead":""}"><span class="rank num">${has?rank(i):"–"}</span><span class="pn">${N(i)}</span><span class="score num">${t[i]}</span>${gap?`<span class="gap num">${gap}</span>`:""}</div>`;
  }).join("");

  let roundBlock = "";
  const rIdx = entry && entry.editing != null ? entry.editing : n;
  if (!fin || entry){
    const cards = dealt(rIdx), d = dealerOf(rIdx), dir = dirOf(rIdx), zero = isZero(rIdx);
    const dirTxt = zero ? "🙈 the zero round" : dir === "down" ? "↓ heading down the river" : dir === "up" ? "↑ heading back up" : "↔ at the turn";
    const tr = entry ? entry.trump : state.pending ? state.pending.trump : null;
    roundBlock = `<div class="strip"><span class="cards num">${state.plan[rIdx]}<small>${zero?"forehead":`card${cards>1?"s":""}`}</small></span>
      <span class="big">Round ${rIdx+1} of ${state.plan.length} · ${dirTxt}${tr?` · trump ${suitHtml(tr)}`:""}</span>
      <span class="meta">${zero?`${N(d)} deals 1 card each. Don't look! Hold it on your forehead, facing out. Then flip the next card for trump.`:`${N(d)} deals ${cards} each, then flips the next card for trump.`}</span>
      <span class="meta">${simul() ? `On three, everyone shows their bid at once. ${N((d+1)%state.players.length)} leads.` : `${N((d+1)%state.players.length)} bids first and leads. ${N(d)} bids last.`}</span></div>`;
    roundBlock += riverMap(state.plan, rIdx);
    if (entry) roundBlock += entryView(rIdx);
    else if (state.pending) roundBlock += pendingView();
    else roundBlock += `<button class="primary" data-act="newRound" id="newRound">Enter bids for round ${n+1}</button>`;
  }

  return top + `<div class="players">${players}</div>` + roundBlock + sheetView() + statsView() +
    `<p class="hint">Every game is saved in History on this device, and the screen stays on while you play. ${SCORING[state.rules.scoring].desc}${simul()?" Everyone bids at once.":state.rules.hook?" Dealer is hooked.":""}</p>`;
}

function hookValue(bids, dealer, cards){
  if (!state.rules.hook) return null;
  const others = bids.filter((b,i)=> i !== dealer);
  if (others.some(b => b == null)) return null;
  const v = cards - others.reduce((a,b)=>a+b,0);
  return v >= 0 && v <= cards ? v : null;
}
function bidTotalLine(bids, cards){
  const got = bids.filter(b=>b!=null).length, s = bids.reduce((a,b)=>a+(b||0),0);
  if (got < bids.length) return `<div class="sumline num">${s} bid so far on ${plural(cards,"trick")}</div>`;
  const diff = s - cards;

function grid(kind, p, val, max, hookV, isAuto){

function statsView(){
  const R = state.rounds, n = R.length; if (!n) return "";
  const np = state.players.length, z = () => Array(np).fill(0);
  const made = z(), zeroBids = z(), zeroMade = z(), over = z(), under = z(), best = Array(np).fill(-Infinity), streakBest = z(), streakCur = z(), hooked = z(), bidSum = z(), tookSum = z(), exactMiss = z();
  const fh = z(), fhMade = z(), big = z(), bigMade = z(), small = z(), smallMade = z();
  const trumpCount = {}, trumpMade = {}, trumpTot = {};
  R.forEach((r,ri) => {
    const d = dealerOf(ri), cards = dealt(ri), zr = isZero(ri);
    if (state.rules.hook && r.bids[d] !== r.tricks[d]) hooked[d]++;
    if (r.trump){ trumpCount[r.trump] = (trumpCount[r.trump]||0) + 1; }
    r.bids.forEach((b,i) => { const tk = r.tricks[i], pts = scoreOf(b,tk), ok = b === tk; bidSum[i] += b; tookSum[i] += tk;
      if (r.trump){ trumpTot[r.trump] = (trumpTot[r.trump]||0) + 1; if (ok) trumpMade[r.trump] = (trumpMade[r.trump]||0) + 1; }
      if (b === 0){ zeroBids[i]++; if (ok) zeroMade[i]++; }
      if (zr){ fh[i]++; if (ok) fhMade[i]++; }
      if (!zr && cards <= 2){ small[i]++; if (ok) smallMade[i]++; }
      if (cards >= Math.max(3, Math.ceil(Math.max(...state.plan)*0.7))){ big[i]++; if (ok) bigMade[i]++; }
      if (ok){ made[i]++; streakCur[i]++; } else { streakCur[i] = 0; if (Math.abs(tk-b) === 1) exactMiss[i]++; if (tk > b) over[i]++; else under[i]++; }
      streakBest[i] = Math.max(streakBest[i], streakCur[i]); best[i] = Math.max(best[i], pts); });
  });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "–";
  const nm = idx => idx.map(N).join(", ");
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const rate = made.map((m)=>m/n);
  const sh = top(rate), st = top(streakBest), zh = top(zeroMade), ov = top(over), un = top(under), bh = top(best), cl = top(exactMiss);
  const fhRate = fh.map((c,i)=> c ? fhMade[i]/c : -1), mr = top(fhRate);
  const cards = [
    aw("Sharpshooter", nm(sh.who), `Hit the bid ${pct(made[sh.who[0]], n)} of the time`),
    aw("Hot streak", st.m?nm(st.who):"Nobody yet", st.m?`${plural(st.m,"bid")} in a row`:""),
    aw("Zero hero", zh.m?nm(zh.who):"Nobody yet", zh.m?`Bid 0 and took 0, ${plural(zh.m,"time")}`:"No zeros made yet"),
    aw("Big haul", nm(bh.who), `${bh.m} points in one round`),
    aw("Too greedy", ov.m?nm(ov.who):"Nobody yet", ov.m?`Took extra tricks ${plural(ov.m,"time")}`:"Nobody's overshot"),
    aw("Came up short", un.m?nm(un.who):"Nobody yet", un.m?`Fell short ${plural(un.m,"time")}`:"Nobody's fallen short"),
    aw("So close", cl.m?nm(cl.who):"Nobody yet", cl.m?`Missed by exactly 1, ${plural(cl.m,"time")}`:"No near misses"),
  ];
  if (fh.some(c=>c)) cards.push(aw("Mind reader", mr.m>0?nm(mr.who):"Nobody yet", mr.m>0?`Made ${pct(fhMade[mr.who[0]], fh[mr.who[0]])} of forehead rounds`:"Nobody's read their forehead right"));
  const trumps = Object.keys(trumpCount);
  const trumpLine = trumps.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Trump</th><th>Rounds</th><th>Bids made</th></tr></thead><tbody>${SUITS.filter(x=>trumpCount[x.k]).map(x=>`<tr><td style="font-size:17px">${suitHtml(x.k)}</td><td>${trumpCount[x.k]}</td><td>${pct(trumpMade[x.k]||0, trumpTot[x.k]||0)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">Tap the trump suit when entering bids and trump stats show up here.</p>`;
  return `<div class="panel"><h2>Stats</h2><div class="hl">${cards.join("")}</div>
  <h3>Bid accuracy</h3>
  <div class="tablewrap"><table class="st"><thead><tr><th>Player</th><th>Made</th><th>Rate</th><th>Streak</th><th>Over</th><th>Under</th><th>Avg bid</th><th>Avg got</th></tr></thead>
  <tbody>${state.players.map((p,i)=>`<tr><td>${N(i)}</td><td>${made[i]}/${n}</td><td>${pct(made[i],n)}</td><td>${streakBest[i]}</td><td>${over[i]}</td><td>${under[i]}</td><td>${(bidSum[i]/n).toFixed(1)}</td><td>${(tookSum[i]/n).toFixed(1)}</td></tr>`).join("")}</tbody></table></div>
  <h3>By kind of round</h3>
  <div class="tablewrap"><table class="st"><thead><tr><th>Player</th><th>Zero bids</th><th>Small hands</th><th>Big hands</th>${fh.some(c=>c)?"<th>🙈 Forehead</th>":""}${state.rules.hook?"<th>Hooked</th>":""}</tr></thead>
  <tbody>${state.players.map((p,i)=>`<tr><td>${N(i)}</td><td>${zeroMade[i]}/${zeroBids[i]} · ${pct(zeroMade[i],zeroBids[i])}</td><td>${pct(smallMade[i],small[i])}</td><td>${pct(bigMade[i],big[i])}</td>${fh.some(c=>c)?`<td>${fhMade[i]}/${fh[i]}</td>`:""}${state.rules.hook?`<td>${hooked[i]}</td>`:""}</tr>`).join("")}</tbody></table></div>
  <h3>Trump</h3>${trumpLine}
  <p class="hint">Rates are the share of bids made exactly. Small hands are 1 and 2 cards. Big hands are the top of the river. Hooked counts rounds a dealer missed their bid.</p></div>`;
}

function simul2(){ return (state.phase==="play" ? state.rules.bidStyle : state.setup.bidStyle) !== "around"; }
function guideView(){

  return `<div class="panel guide" style="gap:14px">
    <section><h2>The idea</h2>
      <p>Each round, everyone predicts exactly how many tricks they'll take. Hit your number on the nose and you score big. Miss by even one and you get ${S.label==="10 + bid"?"nothing":"punished"}. The hand size changes every round, sliding down the river to 1 card and back up again.</p></section>
    <section><h3>What you need</h3>
      <ul><li>One standard 52-card deck. Aces are high.</li>
      <li>2 to 7 players, every player for themselves.</li>

    <section><h3>Each round, step by step</h3>
      <ol><li><b>Deal.</b> The dealer deals the round's number of cards to everyone. The app shows how many.</li>
      <li><b>Flip for trump.</b> Turn the next card face up. Its suit is trump for the round. Trump beats every other suit.</li>
      <li><b>Bid.</b> ${simul2() ? "Everyone looks at their cards, then on the count of three, all players reveal how many tricks they'll take at the same time. Holding up fingers works well, and a fist means zero. Record the bids in the app." : "Starting left of the dealer and going around, each player says how many tricks they'll take. Zero is a legal bid. The dealer bids last."}</li>
      <li><b>Play.</b> The player left of the dealer leads any card. Everyone must follow suit if they can. If you can't, play anything, including trump.</li>
      <li><b>Win the trick.</b> Highest trump wins. If no trump was played, the highest card of the suit that was led wins. The winner leads next.</li>
      <li><b>Score.</b> After all cards are played, count tricks and enter them here. The deal passes left.</li></ol></section>
    <section><h3>Scoring (${S.label})</h3>
      <p>${S.desc}</p>
      <div class="example"><span><b>Example:</b> 5 cards, you bid 2.</span>
        <span>Take exactly 2: ${SCORING[state.phase==="play"?state.rules.scoring:state.setup.scoring].made(2)} points.</span>
        <span>Take 3: ${(S.miss(2,3))} points. Take 1: ${(S.miss(2,1))} points.</span></div></section>
${simul2() ? `<section><h3>Bidding all at once</h3><p>Because everyone reveals at the same time, nobody gets to adjust to the others' bids. The total bid line in the app shows right away whether the table overbid or underbid the round, so you know how cutthroat the play will be.</p></section>` : `    <section><h3>Hooking the dealer</h3>
      <p>With the hook rule on, the dealer can't make a bid that lets the total bids equal the number of cards. Example: 5 cards, and the others bid 1, 2 and 1. That's 4, so the dealer can't bid 1. At least one person is guaranteed to miss. The app blocks the hooked number for you.</p></section>`}
    <section><h3>The 1-card round</h3>
      <p>Near the bottom of the river, everyone gets a single card. Bid 1 if you think your card wins, 0 if it doesn't.</p></section>
    <section><h3>The zero round 🙈</h3>
      <p>At the very bottom, the dealer gives everyone 1 card face down. Without looking at it, you hold it on your forehead facing out. You can see everyone else's card but not your own. Bid based on what you can see: if everyone else's cards look low, bid 1. Then play your card and see if you were right. After the zero round, the river heads back up.</p></section>
    <section><h3>Strategy tips</h3>
      <ul><li>Aces and high trump are usually tricks. Low cards in short suits can become tricks later by trumping in.</li>
      <li>Bidding 0 is often the smart play in small rounds.</li>
      <li>Watch the total bid line. If it's overbid, someone will get set, so play to make others miss.</li>
      <li>If you're already set, spend your cards making someone else miss too.</li></ul></section>
    <section><h3>Winning</h3>
      <p>After the last round, the highest total wins. Ties stand.</p></section>
  </div>`;
}

function autofill(){
  const np = state.players.length, cards = dealt(entry.editing ?? state.rounds.length);
  const unset = [...Array(np).keys()].filter(i => !entry.set[i]);
  if (entry.auto != null && entry.set[entry.auto]) entry.auto = null;
  if (unset.length === 1){
    const p = unset[0], s = [...Array(np).keys()].filter(q=>q!==p).reduce((a,q)=>a+entry.tricks[q],0);
    if (s <= cards){ entry.tricks[p] = cards - s; entry.auto = p; } else { entry.tricks[p] = null; entry.auto = null; }
  } else if (entry.auto != null){ entry.tricks[entry.auto] = null; entry.auto = null; }
}
function openEntry(mode, idx){

  if (mode === "edit"){ const r = state.rounds[idx]; entry = { mode, editing:idx, bids:[...r.bids], tricks:[...r.tricks], trump:r.trump||null, set:Array(np).fill(true), auto:null, error:"" }; }
  else if (mode === "tricks") entry = { mode, editing:null, bids:[...state.pending.bids], trump:state.pending.trump||null, tricks:nul(), set:Array(np).fill(false), auto:null, error:"" };
  else entry = { mode:"bids", editing:null, bids: state.pending ? [...state.pending.bids] : nul(), trump: state.pending ? state.pending.trump : null, tricks:nul(), set:Array(np).fill(false), auto:null, error:"" };

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, su = state.setup;
  switch(act){
    case "tab": state.tab = b.dataset.v; save(); render(); window.scrollTo(0,0); break;
    case "count": su.count = Math.min(7, Math.max(2, su.count + +b.dataset.d)); save(); render(); break;
    case "start": su.start = Math.min(maxCards(su.count), Math.max(1, su.start + +b.dataset.d)); save(); render(); break;
    case "shape": su.shape = b.dataset.v; save(); render(); break;
    case "scoring": su.scoring = b.dataset.v; save(); render(); break;
    case "hook": su.hook = !su.hook; save(); render(); break;
    case "bidStyle": su.bidStyle = b.dataset.v; su.hook = su.bidStyle === "around"; save(); render(); break;
    case "zero": su.zero = !su.zero; save(); render(); break;
    case "trump": entry.trump = entry.trump === b.dataset.v ? null : b.dataset.v; entry.error = ""; render(); break;
    case "begin":
      state.players = Array.from({length:su.count},(_,i)=> (su.names[i]||"").trim() || `Player ${i+1}`);
      state.plan = buildPlan(su.start, su.shape, su.zero !== false); state.rules = { scoring:su.scoring, bidStyle:su.bidStyle || "simul", hook: su.bidStyle === "around" && su.hook }; state.dealer0 = su.firstDealer;
      state.rounds = []; state.pending = null; state.phase = "play"; entry = null; save(); render(); keepAwake(); window.scrollTo(0,0); break;
    case "newRound": case "changeBids": openEntry("bids"); break;
    case "enterTricks": openEntry("tricks"); break;
    case "edit": openEntry("edit", +b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "bid": entry.bids[+b.dataset.p] = +b.dataset.v; entry.error = ""; render(); break;
    case "trick": { const p = +b.dataset.p; entry.tricks[p] = +b.dataset.v; entry.set[p] = true; entry.error = ""; if (entry.mode === "tricks") autofill(); else entry.auto = null; render(); break; }
    case "saveEntry": {
      const idx = entry.editing ?? state.rounds.length, cards = dealt(idx), d = dealerOf(idx), np = state.players.length;
      const missB = entry.bids.findIndex(v => v == null);
      if (missB >= 0){ entry.error = `Pick a bid for ${state.players[missB]}.`; render(); break; }
      const hv = hookValue(entry.bids, d, cards);
      if (entry.mode !== "tricks" && hv != null && entry.bids[d] === hv){ entry.error = `${state.players[d]} is the dealer and can't bid ${hv}. That would make the bids add up to ${cards}.`; render(); break; }
      if (entry.mode === "bids"){ state.pending = { bids:[...entry.bids], trump:entry.trump || null }; entry = null; save(); render(); break; }
      const missT = entry.tricks.findIndex(v => v == null);
      if (missT >= 0){ entry.error = `Pick tricks taken for ${state.players[missT]}.`; render(); break; }
      const s = entry.tricks.reduce((a,v)=>a+v,0);

    case "undo": confirmThen("undo", ()=>{ state.rounds.pop(); state.pending = null; entry = null; save(); render(); }); break;
    case "rematch": state.rounds = []; state.pending = null; state.dealer0 = (state.dealer0 + 1) % state.players.length; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.rounds = []; state.pending = null; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.rounds = []; state.pending = null; entry = null; save(); render(); }); break;
  }
});

// History adapter: how an Up & Down the River game looks to the shared history module.

const HX = {

  guest: n => /^player \d+$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !state.rounds.length) return null;
    const P = state.players, R = state.rounds, t = totals(), fin = done(), hi = Math.max(...t);
    return {
      sides: P.map(n => ({ name: n, players: [n] })),
      rounds: R.map(r => r.bids.map((b,i) => scoreOf(b, r.tricks[i]))),
      done: fin, winners: fin ? t.map((_,i) => i).filter(i => t[i] === hi) : undefined,
      labels: R.map((_,i) => `${i+1} · ${isZero(i) ? "forehead" : plural(state.plan[i], "card")}`),
      note: `${Math.max(...state.plan)}-card river · ${(SCORING[state.rules.scoring] || SCORING.classic).label}`,
      extra: {
        made: P.map((_,i) => R.filter(r => r.bids[i] === r.tricks[i]).length),
        raw: { plan: state.plan, dealer0: state.dealer0, rules: state.rules, rounds: R }
      }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.made)) return "";
    return `<p class="hint">Bids made: ${g.sides.map((s,i) => `${esc(s.name)} ${x.made[i] || 0} of ${g.rounds.length}`).join(" · ")}</p>`;
  },
  records(done){
    const rows = [];
    done.forEach(g => { const x = g.extra; if (x && Array.isArray(x.made)) g.sides.forEach((s,i) => rows.push({ g, who: s.name, v: x.made[i] || 0 })); });
    if (!rows.length) return [];
    const m = Math.max(...rows.map(r => r.v)), top = rows.filter(r => r.v === m);
    const names = [...new Set(top.map(r => r.who))].slice(0,3).join(", ");
    const when = top.length === 1 ? `${m} of ${top[0].g.rounds.length} · ${new Date(top[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" })}` : `${plural(m, "bid")} · ${top.length} times`;
    return [["Most bids made in a game", names, when]];
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button><button class="small" type="button" data-hx="sres" data-id="${e(g.id)}" id="hx-s-${e(g.id)}">${ui.copied === g.id ? "Copied ✓" : "Share"}</button>${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}
      </div>`;
    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${moveView()}${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}${moveView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    if (data && data.kind === BUNDLE && data.apps) data = Array.isArray(data.apps[HX.app]) ? data.apps[HX.app] : [];
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    ui.msg = merge(list);
  }
  // Adds games this phone doesn't have; a game it has is replaced only by a more complete copy (never the one being played).
  function merge(list) {
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    return `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- moving History into a Home Screen icon -----
  // On iPhone an app opened from a Home Screen icon keeps its own storage, separate from Safari. All the card apps
  // share Safari's storage, so one Copy there carries every card game's history; Paste in an icon takes this game's part.
  const BUNDLE = "card-games-history";
  const CARD_APPS = ["hand-foot", "hearts", "skyjo", "cribbage", "spades", "euchre", "pitch", "casino", "flip7", "up-down-river", "presidents", "mao", "card-golf"];
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const standalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const here = () => (location.host + location.pathname).replace(/index\.html$/, "");
  function bundle() {
    const apps = {}; let n = 0, k = 0;
    CARD_APPS.forEach(id => {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(id + "-history-v1") || "[]"); } catch (err) { a = []; }
      if (Array.isArray(a) && a.length) { apps[id] = a; n += a.length; k++; }
    });
    return { text: JSON.stringify({ kind: BUNDLE, version: 1, exported: new Date().toISOString(), apps }), games: n, apps: k };
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (err) { /* older browsers: copy from a hidden box */ }
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    t.remove();
    return ok;
  }
  async function copyAll() {
    const b = bundle(), app = standalone();
    if (!b.games) { ui.mmsg = app ? "There are no games in this app's History yet." : "No card game History is saved in Safari on this phone. If you play from a game's own Home Screen icon, its History is in that icon: open it, tap History, then Copy History."; return; }
    ui.mmsg = await copyText(b.text)
      ? app ? `Copied ${plural(b.games, "game")}. Now open Card Night or the other Home Screen icon and tap Paste History.`
        : `Copied ${plural(b.games, "game")} from ${plural(b.apps, "card app")}. Now open the Home Screen icon or Card Night and tap Paste History.`
      : "Couldn't copy on this browser. Use Share backup instead, then Restore in the other app.";
  }
  async function pasteFromSafari() {
    let text = "";
    try { text = await navigator.clipboard.readText(); } catch (err) { text = ""; }
    if (!text) { ui.pasteBox = true; ui.mmsg = "Long-press the box, tap Paste, then tap Add games."; return; }
    take(text);
  }
  function take(text) {
    let data = null;
    try { data = JSON.parse(text); } catch (err) { data = null; }
    if (data && data.kind === BUNDLE && data.apps && typeof data.apps === "object") {
      const list = data.apps[HX.app];
      ui.pasteBox = false;
      ui.mmsg = Array.isArray(list) && list.length ? merge(list) : `What you copied has no ${HX.title} games.`;
    } else if (data && (data.app === HX.app || Array.isArray(data)) && (Array.isArray(data) || Array.isArray(data.games))) {
      ui.pasteBox = false; ui.mmsg = merge(Array.isArray(data) ? data : data.games);
    } else ui.mmsg = "That isn't card game history. Copy it first: in Safari, History → Copy for Home Screen; in another Home Screen icon, History → Copy History.";
  }
  function moveView() {
    if (!iOS) return "";
    const msg = ui.mmsg ? `<p class="hint" role="status">${e(ui.mmsg)}</p>` : "";
    if (!standalone()) return `<div class="panel"><h2>Home Screen icon</h2>
      <p class="hint">An app opened from a Home Screen icon keeps its own History, separate from Safari. To bring your games over, tap Copy here, then open the Home Screen icon or Card Night and tap Paste History. One Copy carries every card game's history.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy for Home Screen</button></div>${msg}</div>`;
    return `<div class="panel"><h2>Move History</h2>
      <p class="hint">This Home Screen app keeps its own History, separate from Safari and from other Home Screen icons.</p>
      <p class="hint">To move these games into Card Night or another icon, tap Copy History, then open it there and tap Paste History.</p>
      <p class="hint">To bring in games you played in Safari, open ${e(here())} in Safari, tap History, then Copy for Home Screen. Then come back here and tap Paste History.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy History</button><button type="button" data-hx="mpaste" id="hx-mpaste">Paste History</button></div>
      ${ui.pasteBox ? `<textarea id="hx-mtext" class="hx-paste" rows="3" placeholder="Long-press here and tap Paste" aria-label="Copied history"></textarea><div class="btnrow"><button type="button" data-hx="mpaste2" id="hx-mpaste2">Add games</button></div>` : ""}${msg}</div>`;
  }

  // ----- sharing a result as text (group chats) -----
  function resultText(g) {
    const t = totalsOf(g), w = g.done ? winnersOf(g) : [];
    const better = (a, b) => g.lowWins ? a < b : a > b;
    const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
    const rest = order.filter(i => !w.includes(i));
    const lines = [`${HX.title} · ${dayTxt(g.date)}`];
    if (!g.done) lines.push(`Standings after ${plural(g.rounds.length, unitOne, unitMany)}`);
    order.filter(i => w.includes(i)).forEach(i => lines.push(`🏆 ${sideLabel(g.sides[i])} ${num(t[i])}`));
    rest.forEach(i => {
      const pos = w.length + 1 + rest.filter(j => better(t[j], t[i])).length, tied = rest.some(j => j !== i && t[j] === t[i]);
      lines.push(`${tied ? "T" : ""}${pos}. ${sideLabel(g.sides[i])} ${num(t[i])}`);
    });
    const foot = [g.done ? plural(g.rounds.length, unitOne, unitMany) : "", g.note || ""].filter(Boolean).join(" · ");
    if (foot) lines.push(foot);
    const solo = w.length === 1 && g.sides[w[0]].players.length === 1 ? g.sides[w[0]].players[0] : "";
    if (solo && !guest(solo)) {
      const p = career(byDate().filter(x => String(x.date) <= String(g.date))).players.find(x => x.k === pkey(solo));
      if (p && p.streak >= 2) lines.push(`🔥 ${p.name} has won ${p.streak} in a row`);
    }
    return lines.join("\n");
  }
  async function shareResult(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    const text = resultText(g);
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    if (!(await copyText(text))) return;
    ui.copied = id; render();
    setTimeout(() => { if (ui.copied === id) { ui.copied = null; render(); } }, 3000);
  }
  function shareButton(label, cls) {
    const id = state.hxId;
    if (!id || !games.some(g => g.id === id)) return "";
    return `<button class="${cls || "small"}" type="button" data-hx="sres" data-id="${e(id)}" id="hx-sres">${ui.copied === id ? "Copied ✓" : e(label || "Share result")}</button>`;
  }
  function saved() { return `<div class="hx-saved"><span style="opacity:.9">This game is saved in History.</span>${shareButton()}</div>`; }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
    else if (a === "sres") shareResult(b.dataset.id);
    else if (a === "mcopy") copyAll().then(render);
    else if (a === "mpaste") pasteFromSafari().then(render);
    else if (a === "mpaste2") { const t = document.getElementById("hx-mtext"); take(t ? t.value : ""); render(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, saved, shareButton, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
keepAwake();
</script>
